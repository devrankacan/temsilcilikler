server {
    listen 80;
    server_name _;

    # Yükleme boyutu sınırı — büyük görsel dosyaları için
    client_max_body_size 100M;

    # Statik frontend dosyaları
    location /static/ {
        alias /frontend/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Yüklenen görseller — doğrudan Nginx üzerinden sun (daha hızlı)
    location /uploads/ {
        alias /uploads/;
        expires 30d;
        add_header Cache-Control "public";
        # Dizin listeleme kapalı
        autoindex off;
    }

    # Admin paneli
    location /admin {
        alias /frontend/admin/;
        try_files /admin/index.html =404;
    }

    # Temsilci paneli (root)
    location / {
        # Önce API'ye yönlendir
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Yükleme boyutu
        client_max_body_size 100M;
    }
}
