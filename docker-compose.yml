version: "3.9"

services:
  api:
    build: ./backend
    container_name: iyilik_api
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-BURAYA_GUCLU_BIR_ANAHTAR_YAZ_degistir}
      - UPLOAD_DIR=/uploads
      - SCRAPER_SECRET=${SCRAPER_SECRET:-scraper-secret-key}
    volumes:
      - ./uploads:/uploads
      - ./data:/app
    networks:
      - iyilik_net

  scraper:
    build: ./scraper
    container_name: iyilik_scraper
    restart: unless-stopped
    environment:
      - API_BASE=http://api:8000
      - SCRAPER_SECRET=${SCRAPER_SECRET:-scraper-secret-key}
    depends_on:
      - api
    networks:
      - iyilik_net

  nginx:
    image: nginx:1.27-alpine
    container_name: iyilik_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/frontend:ro
      - ./uploads:/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - iyilik_net

networks:
  iyilik_net:
    driver: bridge
