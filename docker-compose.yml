version: "3.9"

services:
  api:
    build: ./backend
    container_name: iyilik_api
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-BURAYA_GUCLU_BIR_ANAHTAR_YAZ_degistir}
      - UPLOAD_DIR=/uploads
    volumes:
      - ./uploads:/uploads          # Görseller host'ta kalır — yedek için
      - ./data:/app                  # SQLite veritabanı host'ta kalır
    networks:
      - iyilik_net

  nginx:
    image: nginx:1.27-alpine
    container_name: iyilik_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/frontend:ro
      - ./uploads:/uploads:ro
    depends_on:
      - api
    networks:
      - iyilik_net

networks:
  iyilik_net:
    driver: bridge
